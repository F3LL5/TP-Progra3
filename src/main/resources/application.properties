spring.application.name=TP_prg3
# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/comercio?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=7531
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA (Hibernate)
